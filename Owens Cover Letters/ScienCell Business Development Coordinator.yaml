salutation: Dear ScienCell Hiring Team,

body: |
  I am applying for the Business Development Coordinator role at ScienCell Research Laboratories in Carlsbad. I am a San Diego-based SDSU graduate with a B.S. in Business Administration and experience in market research, B2B client support, outreach, and cross-functional coordination. I am drawn to ScienCell's science-driven mission and the opportunity to support growth in a technical, research-focused market.

  Through Ecstasy Angel, I identified growth opportunities through market research and customer feedback, prepared marketing materials and launch content, and delivered responsive client service that helped build a loyal customer base and $10K+ in revenue. At BandHouse, I conduct market research across event discovery, coordinate partner outreach, and collaborate across teams to align messaging and support growth initiatives. Through monoright.com, I manage B2B client accounts with proposal coordination, presentations, performance reporting, and timely follow-up.

  I am comfortable learning technical product information quickly and communicating it clearly to different audiences, including work researching complex topics for a published book on venture capital. I would welcome the opportunity to support ScienCell's sales, marketing, and scientific teams with research, proposals, customer follow-up, and outreach events. Thank you for your consideration. My resume is attached.

closing: Sincerely,
