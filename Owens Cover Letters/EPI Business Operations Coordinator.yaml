salutation: Dear EPI Hiring Team,

body: |
  I am applying for the Business Operations Coordinator role in Scripps Ranch. I recently graduated from SDSU's Fowler College of Business with a B.S. in Business Administration and have experience coordinating operations, onboarding, events, and documentation across fast-paced, cross-functional environments. I am excited by EPI's growth, EPI University, and the opportunity to help build the operational systems that support your people and clients.

  At BandHouse, I coordinate schedules, event logistics, and organized records across 150+ events and 40+ venues. At monoright.com, I manage concurrent projects, prepare client-facing materials, and keep documentation accurate and current. Through Ecstasy Angel and PinHaus, I supported onboarding, vendor coordination, and process documentation with strong attention to detail and professional communication.

  I am organized, dependable, and comfortable serving as a visible point of contact for stakeholders at all levels. I would welcome the chance to support training programs, business operations, and office coordination while growing with EPI. Thank you for your consideration. My resume is attached.

closing: Sincerely,
