body: |
  I am applying for the Associate Account Executive role in San Diego. I recently graduated from SDSU's Fowler College of Business with a B.S. in Business Administration and have spent the past several years supporting prospecting, outreach, and sales follow-up in fast-paced environments. I am excited by XiFin's mission to simplify the business side of healthcare and eager to grow my career in healthcare technology sales.

  At monoright.com, I research prospects, manage outreach and follow-up, and track activity and KPIs to support pipeline momentum. At BandHouse, I cultivate partner prospects and keep organized account records across 150+ events and 40+ venues. Through Ecstasy Angel, I built hands-on sales support experience through customer outreach, relationship building, and consistent follow-through.

  I am self-motivated, organized, and comfortable working independently or on a team. I am ready to learn Salesforce quickly, travel as needed, and contribute to a results-driven sales team from day one. Thank you for your consideration. My resume is attached.

