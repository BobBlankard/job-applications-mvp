salutation: Dear Front Row Hiring Team,

body: |
  I am writing to apply for the Social Content Manager role supporting DMS. I am a San Diego-based content strategist and brand builder with hands-on experience creating social-first, lo-fi content for fashion, culture, and consumer brands. Your focus on platform-native storytelling, cultural relevance, and performance-driven creative aligns closely with the work I have been doing across my own brands and client projects.

  Through Ecstasy Angel, I built and grew a fashion and art-driven brand to 10K+ organic followers with around 8-12% engagement by creating visual content that felt native to social platforms rather than over-produced. I managed creative direction from concept through posting, including product storytelling, brand aesthetics, and seasonal narratives that supported e-commerce growth and helped generate $10K+ in revenue.

  I also have direct short-form content experience through Seed to Harvest, where I produced 20+ clips from long-form video and improved retention by about 25% and completion rates by about 1.8x by optimizing hooks, pacing, and structure for short-form environments. More recently, through PinHaus and BandHouse, I have developed social-first concepts around fashion, styling, trends, and cultural discovery, using research and performance insights to shape content that drives engagement and business results.

  What excites me about Front Row is the opportunity to do this kind of work at scale for leading brands. I enjoy translating strategy into creative that earns attention, briefing and collaborating across teams, and using data to refine what resonates. I have attached my resume and portfolio and would welcome the opportunity to discuss how I can contribute to breakthrough content for your clients.

closing: Sincerely,
signature_name: Owen Doherty
