body: |
  I am applying for the Sales Assistant role in San Diego. I recently graduated from SDSU with a B.S. in Business Administration and have spent the past several years supporting outreach, follow-up, and client communication in fast-paced, growth-focused environments. I am looking for an on-site opportunity where I can bring energy, professionalism, and follow-through while learning directly from the business owner.

  Through Ecstasy Angel, I supported sales-related outreach, customer follow-up, and relationship building that helped grow the brand to 10K+ followers and $10K+ in revenue. At BandHouse, I help coordinate partner outreach, meetings, and organized records that keep growth efforts moving. Through monoright.com, I manage client communication, documented project timelines, and sales-support materials with strong responsiveness and attention to detail.

  I am dependable, polished, and comfortable stepping in wherever needed to support momentum. I am excited by the opportunity to grow into a Sales Coordinator role over time while contributing to ProActivate from day one. Thank you for your consideration. My resume is attached.

