body: |
  I am applying for the Analyst role on the SPAR Client Service Solutions team in La Jolla. I am a San Diego-based SDSU graduate with a B.S. in Business Administration and experience supporting client requests, performance reporting, and deadline-driven deliverables. I am drawn to StepStone's focus on private markets and data-driven client reporting, and I am eager to contribute to a detail-oriented, team-oriented SPAR environment.

  Through monoright.com, I manage client accounts with responsive communication, organized documentation, and timely reporting using Google Analytics and structured deliverables. At Ecstasy Angel, I tracked expenses, vendor costs, and business metrics while handling customer inquiries with accuracy and consistency. At BandHouse, I maintain reliable datasets and coordinate information across teams to support recurring reporting needs and resolve discrepancies proactively.

  I also researched venture capital and private markets topics for a published book, which strengthened my interest in investment reporting and financial data. I am comfortable with Excel, basic SQL, and learning reporting tools such as Power BI quickly. Thank you for your consideration. My resume is attached.

