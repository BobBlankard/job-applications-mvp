body: |
  I am applying for the Business Process Analyst role with the BPS group in Poway. I recently graduated from SDSU's Fowler College of Business with a B.S. in Business Administration and have experience supporting requirements documentation and cross-functional coordination for software-enabled workflows. I am excited to help engineers and managers adopt internal tools for project planning and resource management.

