body: |
  I am applying for the Client Associate role (Ref. 340079BR) with your San Diego Wealth Management team. I am a San Diego-based SDSU graduate from the Fowler College of Business with experience in client-facing operations, marketing, and day-to-day team support. UBS's focus on exceptional client experience and thoughtful service aligns closely with how I work.

  At Ecstasy Angel, I managed daily operations for a direct-to-consumer brand, including customer communication, expense tracking, marketing materials, and website content. At BandHouse, I coordinate operations and event content for a live music discovery platform. Through monoright.com, I support client accounts with responsive communication, content updates, and on-time delivery.

  I am drawn to this role's mix of operations, marketing, and client support in a wealth management setting. My entrepreneurial background has trained me to anticipate needs, stay organized, and improve processes proactively. Thank you for your consideration. My resume is attached.

