salutation: Dear AppFolio Hiring Team,

body: |
  I am applying for the User Experience Designer role on the Investment Manager team. I am a San Diego-based UX designer with experience in user research, Figma prototyping, and cross-functional product development. AppFolio's focus on ease of use and customer-centered design aligns closely with how I work.

  At PinHaus and BandHouse, I have owned UX from discovery through launch, including wireframes, user flows, and usability testing. Through 20+ research sessions, I improved onboarding completion from 62% to 84% and reduced time-to-discovery by about 30%. I partner closely with engineering to validate ideas early and deliver solutions that balance user needs with business goals.

  I am drawn to this role's focus on complex workflows and end-user advocacy. I would welcome the opportunity to bring my research-driven process and collaborative mindset to your team. Thank you for your consideration. My resume and portfolio are attached.

closing: Sincerely,
