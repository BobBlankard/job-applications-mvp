salutation: Dear Lido Advisors Hiring Team,

body: |
  I am applying for the Associate, Client Relationship Manager role in San Diego. I am a SDSU graduate with a B.S. in Business Administration and experience supporting client onboarding, service requests, and accurate record keeping in fast-paced environments. I am drawn to Lido's client-first culture and the opportunity to support advisory teams delivering comprehensive wealth strategies.

  At Ecstasy Angel, I managed client-facing operations including onboarding, inquiries, order follow-up, and detailed customer records across sales and fulfillment workflows. Through monoright.com, I support multiple client accounts with responsive communication, organized documentation, and deadline-driven deliverables. At BandHouse, I maintain reliable client-facing data and coordinate across teams to keep open items moving forward.

  I bring strong Excel skills, attention to detail, and a finance-adjacent background from researching venture capital and investing for a published book. I am prepared to pursue the Series 65 and am eager to grow within an RIA environment focused on exceptional client service. Thank you for your consideration. My resume is attached.

